rules:
  - id: myoc.sql.no-select-star
    message: Avoid SELECT *; list the needed columns explicitly.
    severity: ERROR
    languages:
      - generic
    paths:
      include:
        - "**/*.js"
        - "**/*.mjs"
        - "**/*.sql"
        - "**/*.ts"
        - "**/*.tsx"
    pattern-regex: (?i)\bselect\s+\*

  - id: myoc.sql.no-delete-without-where
    message: DELETE statements must include a WHERE clause. Use a narrow exception only for isolated test database resets.
    severity: ERROR
    languages:
      - javascript
      - typescript
    paths:
      include:
        - "**/*.js"
        - "**/*.mjs"
        - "**/*.ts"
        - "**/*.tsx"
    patterns:
      - pattern-either:
          - pattern: $DB.prepare($SQL)
          - pattern: $DB.exec($SQL)
      - metavariable-regex:
          metavariable: $SQL
          regex: (?is)^['"`]\s*delete\s+from\b
      - pattern-not-regex: (?i)\bwhere\b

  - id: myoc.scripts.no-literal-delete-without-where
    message: Literal DELETE statements in scripts must include a WHERE clause.
    severity: ERROR
    languages:
      - javascript
      - typescript
    paths:
      include:
        - /scripts/**/*.js
        - /scripts/**/*.mjs
        - /scripts/**/*.ts
        - /semgrep-tests/noLiteralDeleteWithoutWhere.mjs
    patterns:
      - pattern-either:
          - pattern: const $NAME = $SQL
          - pattern: let $NAME = $SQL
          - pattern: var $NAME = $SQL
      - metavariable-regex:
          metavariable: $SQL
          regex: (?is)^['"`]?\s*delete\s+from\s+(?:"[a-z_][a-z0-9_]*"|[a-z_][a-z0-9_]*)\s*;

  - id: myoc.routes.no-direct-json-response
    message: API and page-action JSON responses must go through jsonResponse with an explicit Zod response schema.
    severity: ERROR
    languages:
      - javascript
      - typescript
    paths:
      include:
        - /apps/backend/src/routes/api/**/*.ts
        - /apps/backend/src/routes/api/**/*.tsx
        - /apps/backend/src/routes/page-actions/**/*.ts
        - /apps/backend/src/routes/page-actions/**/*.tsx
        - /apps/backend/src/lib/auth/authorization.ts
        - /apps/backend/src/lib/http/csrf.ts
        - /semgrep-tests/routes/**/*.ts
      exclude:
        - "**/*.test.ts"
        - "**/*.test.tsx"
    pattern-either:
      - pattern: c.json(...)
      - pattern: Response.json(...)
      - pattern: new Response(JSON.stringify(...), ...)
      - pattern: new Response(JSON.stringify(...))
      - pattern: c.body(JSON.stringify(...), ...)
      - pattern: c.body(JSON.stringify(...))

  - id: myoc.routes.no-image-body-proxy
    message: Route handlers must not proxy body streams through the Worker; serve media from public R2 URLs or document a narrow exception.
    severity: ERROR
    languages:
      - javascript
      - typescript
    paths:
      include:
        - /apps/backend/src/routes/**/*.ts
        - /apps/backend/src/routes/**/*.tsx
        - /semgrep-tests/routes/**/*.ts
      exclude:
        - "**/*.test.ts"
        - "**/*.test.tsx"
    patterns:
      - pattern-either:
          - pattern: new Response($SOURCE.body, ...)
          - pattern: $C.body($SOURCE.body, ...)

  - id: myoc.routes.no-direct-image-response
    message: Route handlers must not return image bytes directly; return a public media URL instead.
    severity: ERROR
    languages:
      - javascript
      - typescript
    paths:
      include:
        - /apps/backend/src/routes/**/*.ts
        - /apps/backend/src/routes/**/*.tsx
        - /semgrep-tests/routes/**/*.ts
      exclude:
        - "**/*.test.ts"
        - "**/*.test.tsx"
    patterns:
      - pattern-either:
          - pattern: |
              new Response($BODY, { ..., headers: { ..., 'content-type': $CONTENT_TYPE, ... }, ... })
          - pattern: |
              new Response($BODY, { ..., headers: { ..., "content-type": $CONTENT_TYPE, ... }, ... })
          - pattern: |
              new Response($BODY, { ..., headers: { ..., 'Content-Type': $CONTENT_TYPE, ... }, ... })
          - pattern: |
              new Response($BODY, { ..., headers: { ..., "Content-Type": $CONTENT_TYPE, ... }, ... })
          - pattern: |
              $C.body($BODY, $STATUS, { ..., 'content-type': $CONTENT_TYPE, ... })
          - pattern: |
              $C.body($BODY, $STATUS, { ..., "content-type": $CONTENT_TYPE, ... })
          - pattern: |
              $C.body($BODY, $STATUS, { ..., 'Content-Type': $CONTENT_TYPE, ... })
          - pattern: |
              $C.body($BODY, $STATUS, { ..., "Content-Type": $CONTENT_TYPE, ... })
      - metavariable-regex:
          metavariable: $CONTENT_TYPE
          regex: (?i)^['"]image/

  - id: myoc.views.require-safe-json-in-json-ld-script
    message: JSON-LD scripts must use serializeJsonForHtmlScript to escape HTML script-breaking characters.
    severity: ERROR
    languages:
      - typescript
    paths:
      include:
        - /apps/backend/src/views/**/*.tsx
        - /semgrep-tests/**/*.tsx
      exclude:
        - "**/*.test.tsx"
    patterns:
      - pattern-either:
          - pattern: |
              <$TAG ... dangerouslySetInnerHTML={{__html: $JSON}} ... type="application/ld+json" ... />
          - pattern: |
              <$TAG ... dangerouslySetInnerHTML={{__html: $JSON}} ... type="application/ld+json" ...>...</$TAG>
      - pattern-not: |
          <$TAG ... dangerouslySetInnerHTML={{__html: serializeJsonForHtmlScript(...)}} ... type="application/ld+json" ... />
      - pattern-not: |
          <$TAG ... dangerouslySetInnerHTML={{__html: serializeJsonForHtmlScript(...)}} ... type="application/ld+json" ...>...</$TAG>
