name: Semgrep

on:
  workflow_dispatch: {}
  pull_request: {}
  push:
    branches:
      - main
      - master
    paths:
      - .github/workflows/semgrep.yml
  schedule:
    # Use an uncommon time to reduce the load on GitHub Actions.
    - cron: '12 15 * * *'

jobs:
  semgrep:
    name: semgrep/ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}
    container:
      image: semgrep/semgrep
    if: ${{ github.actor != 'dependabot[bot]' }}

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10

      - name: Test custom Semgrep rules
        run: |
          set -eu
          for target in \
            semgrep-tests/noDeleteWithoutWhere.ts \
            semgrep-tests/noLiteralDeleteWithoutWhere.mjs \
            semgrep-tests/noSelectStar.ts \
            semgrep-tests/routes/directImageResponse.ts \
            semgrep-tests/routes/directJsonResponse.ts \
            semgrep-tests/routes/imageBodyProxy.ts \
            semgrep-tests/scriptJson.semgrep-test.tsx
          do
            semgrep test --config .semgrep.yml "$target"
          done

      - name: Run custom Semgrep rules
        run: semgrep scan --config .semgrep.yml --error .

      - name: Run Semgrep Platform checks
        run: semgrep ci
