name: Production Deployment
run-name: Deploy ${{ github.event.workflow_run.head_sha }} to production

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed

permissions:
  contents: read

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy production
    if: >-
      ${{
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'master' &&
        github.event.workflow_run.head_repository.full_name == github.repository &&
        github.event.workflow_run.path == '.github/workflows/ci.yml'
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
      url: https://myoc.art

    steps:
      - name: Checkout tested commit
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Set up project
        uses: ./.github/actions/setup-node

      - name: Check Docker
        run: docker info

      - name: Build assets
        run: npm run build

      - name: Ensure image processing queues
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          for queue in \
            myoc-image-processing \
            myoc-image-processing-dlq
          do
            npx wrangler queues info "$queue" >/dev/null 2>&1 || npx wrangler queues create "$queue"
          done

      - name: Migrate production D1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply myoc-db --remote --config apps/backend/wrangler.jsonc

      - name: Deploy production Hono Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: npm run deploy --workspace @myoc/backend -- --message "GitHub Actions ${HEAD_SHA}"

      - name: Deploy production SvelteKit Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: npm run deploy --workspace @myoc/web -- --message "GitHub Actions ${HEAD_SHA}"
