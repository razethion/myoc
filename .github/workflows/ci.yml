name: CI

on:
  push:
    branches:
      - master
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false

      - name: Set up project
        uses: ./.github/actions/setup-node

      - name: Run Biome
        run: npm run lint

  typecheck:
    name: Type check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false

      - name: Set up project
        uses: ./.github/actions/setup-node

      - name: Check TypeScript
        run: npm run typecheck

  dead-code-production:
    name: Production dead code
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false

      - name: Set up project
        uses: ./.github/actions/setup-node

      - name: Check production code
        run: npm run deadcode:production

  dead-code-all:
    name: All dead code
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false

      - name: Set up project
        uses: ./.github/actions/setup-node

      - name: Check all code
        run: npm run deadcode:nonproduction

  preview-processor-tests:
    name: Preview processor tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false

      - name: Set up preview processor
        uses: ./.github/actions/setup-node
        with:
          node-version: '26'
          working-directory: apps/backend/containers/myoc-docker-sharp

      - name: Test preview processor
        working-directory: apps/backend/containers/myoc-docker-sharp
        run: npm run check

  preview-processor-image:
    name: Preview processor image
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false

      - name: Build preview processor image
        run: docker build --tag myoc-docker-sharp-ci apps/backend/containers/myoc-docker-sharp

  quality:
    name: Quality checks passed
    if: ${{ always() && !cancelled() }}
    needs:
      - dead-code-all
      - dead-code-production
      - lint
      - preview-processor-image
      - preview-processor-tests
      - typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Require successful checks
        env:
          DEAD_CODE_ALL_RESULT: ${{ needs.dead-code-all.result }}
          DEAD_CODE_PRODUCTION_RESULT: ${{ needs.dead-code-production.result }}
          LINT_RESULT: ${{ needs.lint.result }}
          PREVIEW_PROCESSOR_IMAGE_RESULT: ${{ needs.preview-processor-image.result }}
          PREVIEW_PROCESSOR_TESTS_RESULT: ${{ needs.preview-processor-tests.result }}
          TYPECHECK_RESULT: ${{ needs.typecheck.result }}
        run: |
          for result in \
            "$DEAD_CODE_ALL_RESULT" \
            "$DEAD_CODE_PRODUCTION_RESULT" \
            "$LINT_RESULT" \
            "$PREVIEW_PROCESSOR_IMAGE_RESULT" \
            "$PREVIEW_PROCESSOR_TESTS_RESULT" \
            "$TYPECHECK_RESULT"
          do
            if [ "$result" != "success" ]; then
              echo "::error::One or more quality checks failed."
              exit 1
            fi
          done

  preview-artifact:
    name: Build dev preview artifact
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout immutable pull request commit
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Set up project
        uses: ./.github/actions/setup-node

      - name: Build dev preview assets
        run: npm run build

      - name: Build processor container
        run: docker build --tag myoc-docker-sharp-dev-check apps/backend/containers/myoc-docker-sharp

      - name: Build immutable deployment artifact
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          build_root="$RUNNER_TEMP/myoc-dev-build"
          artifact_root="$RUNNER_TEMP/myoc-dev-artifact"
          mkdir -p "$build_root/worker" "$build_root/web" "$artifact_root/worker" "$artifact_root/container" "$artifact_root/seeds" "$artifact_root/web"

          node <<'NODE'
          const fs = require('node:fs')
          const path = require('node:path')

          const config = {
            name: 'myoc-dev-artifact',
            main: path.join(process.env.GITHUB_WORKSPACE, 'apps/backend/src/index.ts'),
            compatibility_date: '2026-06-10',
          }

          fs.writeFileSync(path.join(process.env.RUNNER_TEMP, 'myoc-dev-build', 'wrangler.build.jsonc'), `${JSON.stringify(config, null, 2)}\n`)
          NODE

          ./node_modules/.bin/wrangler deploy \
            --config "$build_root/wrangler.build.jsonc" \
            --dry-run \
            --minify \
            --outdir "$build_root/worker"

          ./node_modules/.bin/wrangler deploy \
            --config apps/web/wrangler.jsonc \
            --dry-run \
            --minify \
            --outdir "$build_root/web"

          if find apps/backend/public apps/backend/containers/myoc-docker-sharp apps/backend/migrations apps/backend/seeds/development.sql apps/web/.svelte-kit -type l -print -quit | grep -q .; then
            echo "::error::The deployment artifact cannot contain symbolic links."
            exit 1
          fi

          cp "$build_root/worker/index.js" "$artifact_root/worker/index.js"
          cp -R apps/backend/public "$artifact_root/public"
          cp -R apps/backend/migrations "$artifact_root/migrations"
          cp apps/backend/seeds/development.sql "$artifact_root/seeds/development.sql"
          cp apps/backend/containers/myoc-docker-sharp/Dockerfile "$artifact_root/container/Dockerfile"
          cp apps/backend/containers/myoc-docker-sharp/package.json "$artifact_root/container/package.json"
          cp apps/backend/containers/myoc-docker-sharp/package-lock.json "$artifact_root/container/package-lock.json"
          cp apps/backend/containers/myoc-docker-sharp/preview.mjs "$artifact_root/container/preview.mjs"
          cp apps/backend/containers/myoc-docker-sharp/server.mjs "$artifact_root/container/server.mjs"
          cp -R apps/web/.svelte-kit/cloudflare "$artifact_root/web/cloudflare"
          cp "$build_root/web/_worker.js" "$artifact_root/web/cloudflare/_worker.js"
          printf '%s\n' "$HEAD_SHA" > "$artifact_root/commit.txt"

          (
            cd "$artifact_root"
            find . -type f ! -name manifest.sha256 -print0 | sort -z | xargs -0 sha256sum > manifest.sha256
          )
          tar -czf "$RUNNER_TEMP/myoc-dev-preview.tgz" -C "$artifact_root" .

      - name: Upload immutable deployment artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: dev-preview-${{ github.event.pull_request.head.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/myoc-dev-preview.tgz
          if-no-files-found: error
          retention-days: 7
