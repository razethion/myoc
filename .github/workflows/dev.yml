name: Dev Preview
run-name: "Dev preview for ${{ github.event.workflow_run.head_branch }}"

on:
  workflow_run:
    workflows:
      - Checks and Deploy
    types:
      - completed

permissions:
  actions: read
  contents: read
  pull-requests: read

jobs:
  validate:
    name: Prepare deployment
    if: ${{ github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository }}
    permissions:
      actions: read
      contents: read
      deployments: write
      pull-requests: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      artifact_id: ${{ steps.pull-request.outputs.artifact_id }}
      artifact_run_id: ${{ steps.pull-request.outputs.artifact_run_id }}
      deployment_id: ${{ steps.github-deployment.outputs.deployment_id }}
      head_sha: ${{ steps.pull-request.outputs.head_sha }}
      pull_request: ${{ steps.pull-request.outputs.pull_request }}

    steps:
      - name: Require the trusted workflow
        env:
          WORKFLOW_REF: ${{ github.ref }}
        run: |
          if [ "$WORKFLOW_REF" != "refs/heads/master" ]; then
            echo "::error::Run this workflow from the master branch."
            exit 1
          fi

      - name: Resolve immutable pull request commit
        id: pull-request
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          script: |
            const workflowRun = context.payload.workflow_run

            if (workflowRun.event !== 'pull_request' || workflowRun.conclusion !== 'success') {
              core.setFailed('The triggering checks run must be a successful pull request run.')
              return
            }

            if (workflowRun.path !== '.github/workflows/checks.yml') {
              core.setFailed('The triggering checks run must use checks.yml.')
              return
            }

            const pullRequests = await github.paginate(github.rest.repos.listPullRequestsAssociatedWithCommit, {
              ...context.repo,
              commit_sha: workflowRun.head_sha,
              per_page: 100,
            })
            const matchingPullRequests = pullRequests.filter((pullRequest) =>
              pullRequest.state === 'open' &&
              pullRequest.base.ref === 'master' &&
              pullRequest.head.sha === workflowRun.head_sha &&
              pullRequest.head.repo?.full_name === `${context.repo.owner}/${context.repo.repo}`,
            )

            if (matchingPullRequests.length !== 1) {
              core.setFailed('The triggering checks commit must identify one open pull request to master.')
              return
            }

            const pullRequest = matchingPullRequests[0]
            const pullNumber = pullRequest.number

            const headSha = workflowRun.head_sha
            if (pullRequest.head.sha !== headSha) {
              core.setFailed('The pull request changed after this checks run completed.')
              return
            }

            const artifactName = `dev-preview-${headSha}-${workflowRun.run_attempt}`
            const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {
              ...context.repo,
              run_id: workflowRun.id,
              per_page: 100,
            })
            const matchingArtifacts = artifacts.filter((candidate) => candidate.name === artifactName && !candidate.expired)

            if (matchingArtifacts.length !== 1) {
              core.setFailed(`The triggering checks run must have one dev preview artifact for ${headSha}.`)
              return
            }

            const selectedArtifact = matchingArtifacts[0]
            if (!/^sha256:[0-9a-f]{64}$/i.test(selectedArtifact.digest || '')) {
              core.setFailed('The dev preview artifact does not have a valid SHA-256 digest.')
              return
            }

            core.setOutput('head_sha', headSha)
            core.setOutput('artifact_id', String(selectedArtifact.id))
            core.setOutput('artifact_run_id', String(workflowRun.id))
            core.setOutput('pull_request', String(pullNumber))

      - name: Create pending PR deployment
        id: github-deployment
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        env:
          HEAD_SHA: ${{ steps.pull-request.outputs.head_sha }}
          PR_NUMBER: ${{ steps.pull-request.outputs.pull_request }}
        with:
          script: |
            const pullNumber = Number.parseInt(process.env.PR_NUMBER, 10)
            const logUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            const { data: deployment } = await github.rest.repos.createDeployment({
              ...context.repo,
              ref: process.env.HEAD_SHA,
              task: 'deploy',
              auto_merge: false,
              required_contexts: [],
              payload: { pull_request: pullNumber },
              environment: 'development',
              description: `Dev preview for PR #${pullNumber}`,
              transient_environment: true,
              production_environment: false,
            })

            core.setOutput('deployment_id', String(deployment.id))
            await github.rest.repos.createDeploymentStatus({
              ...context.repo,
              deployment_id: deployment.id,
              state: 'pending',
              log_url: logUrl,
              description: 'Waiting for development approval.',
              environment: 'development',
              auto_inactive: false,
            })

  deploy:
    name: Approve PR #${{ needs.validate.outputs.pull_request }} at ${{ needs.validate.outputs.head_sha }} from checks run ${{ needs.validate.outputs.artifact_run_id }}
    needs:
      - validate
    concurrency:
      group: dev-preview-${{ needs.validate.outputs.pull_request }}
      cancel-in-progress: false
    permissions:
      actions: read
      contents: read
      deployments: write
      pull-requests: read
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: development
      deployment: false

    steps:
      - name: Revalidate pull request after approval
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        env:
          HEAD_SHA: ${{ needs.validate.outputs.head_sha }}
          PR_NUMBER: ${{ needs.validate.outputs.pull_request }}
        with:
          script: |
            const pullNumber = Number.parseInt(process.env.PR_NUMBER, 10)
            const { data: pullRequest } = await github.rest.pulls.get({
              ...context.repo,
              pull_number: pullNumber,
            })

            if (
              pullRequest.state !== 'open' ||
              pullRequest.base.ref !== 'master' ||
              pullRequest.head.sha !== process.env.HEAD_SHA ||
              pullRequest.head.repo?.full_name !== `${context.repo.owner}/${context.repo.repo}`
            ) {
              core.setFailed('The approved pull request commit is no longer current.')
            }

      - name: Mark PR deployment in progress
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        env:
          DEPLOYMENT_ID: ${{ needs.validate.outputs.deployment_id }}
        with:
          script: |
            const deploymentId = Number.parseInt(process.env.DEPLOYMENT_ID, 10)
            const { data: statuses } = await github.rest.repos.listDeploymentStatuses({
              ...context.repo,
              deployment_id: deploymentId,
              per_page: 1,
            })

            if (statuses[0]?.state === 'success' || statuses[0]?.state === 'inactive') {
              return
            }

            const logUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            await github.rest.repos.createDeploymentStatus({
              ...context.repo,
              deployment_id: deploymentId,
              state: 'in_progress',
              log_url: logUrl,
              description: 'Deploying the approved dev preview.',
              environment: 'development',
              auto_inactive: false,
            })

      - name: Validate development credentials
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ] || [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Configure the development environment Cloudflare credentials."
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install trusted Wrangler
        id: wrangler
        working-directory: ${{ runner.temp }}
        run: |
          npm install --prefix "$RUNNER_TEMP/myoc-dev-wrangler" --no-save wrangler@4.125.0
          echo "path=$RUNNER_TEMP/myoc-dev-wrangler/node_modules/.bin/wrangler" >> "$GITHUB_OUTPUT"

      - name: Download immutable deployment artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: ${{ needs.validate.outputs.artifact_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/myoc-dev-control/download
          repository: ${{ github.repository }}
          run-id: ${{ needs.validate.outputs.artifact_run_id }}

      - name: Verify immutable deployment artifact
        env:
          HEAD_SHA: ${{ needs.validate.outputs.head_sha }}
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail

          control_root="$RUNNER_TEMP/myoc-dev-control"
          artifact_root="$control_root/artifact"
          mkdir -p "$artifact_root"

          python3 <<'PYTHON'
          import hashlib
          import os
          import re
          import shutil
          import tarfile
          from pathlib import Path

          control_root = Path(os.environ['RUNNER_TEMP']) / 'myoc-dev-control'
          artifact_root = control_root / 'artifact'
          archive_path = control_root / 'download' / 'myoc-dev-preview.tgz'
          expected_sha = os.environ['HEAD_SHA']
          max_files = 20_000
          max_size = 512 * 1024 * 1024
          required_files = {
              'commit.txt',
              'container/Dockerfile',
              'container/package-lock.json',
              'container/package.json',
              'container/preview.mjs',
              'container/server.mjs',
              'manifest.sha256',
              'seeds/development.sql',
              'worker/index.js',
          }

          def normalize_name(name):
              if name.startswith('/') or any(ord(character) < 32 or ord(character) == 127 for character in name):
                  raise ValueError(f'Unsafe archive path: {name!r}')

              parts = name.split('/')
              while parts and parts[0] == '.':
                  parts.pop(0)
              if parts and parts[-1] == '':
                  parts.pop()
              if any(part in {'', '.', '..'} for part in parts):
                  raise ValueError(f'Unsafe archive path: {name!r}')
              return '/'.join(parts)

          def is_allowed(name, is_directory):
            if not name:
              return is_directory
            if is_directory:
              return name in {'container', 'migrations', 'public', 'seeds', 'worker'} or name.startswith(('container/', 'migrations/', 'public/'))
            return name in required_files or name.startswith(('container/', 'migrations/', 'public/'))

          seen = set()
          total_size = 0
          with tarfile.open(archive_path, mode='r:gz') as archive:
              members = archive.getmembers()
              if len(members) > max_files:
                  raise ValueError('The deployment artifact contains too many entries.')

              for member in members:
                  name = normalize_name(member.name)
                  if name in seen:
                      raise ValueError(f'Duplicate archive path: {name!r}')
                  seen.add(name)

                  if not member.isfile() and not member.isdir():
                      raise ValueError(f'Unsupported archive entry: {name!r}')
                  if not is_allowed(name, member.isdir()):
                      raise ValueError(f'Unexpected archive entry: {name!r}')

                  total_size += member.size
                  if total_size > max_size:
                      raise ValueError('The deployment artifact is too large.')

                  if not name:
                      continue
                  destination = artifact_root / name
                  if member.isdir():
                      destination.mkdir(parents=True, exist_ok=False)
                      continue

                  destination.parent.mkdir(parents=True, exist_ok=True)
                  source = archive.extractfile(member)
                  if source is None:
                      raise ValueError(f'Cannot read archive entry: {name!r}')
                  with source, destination.open('xb') as output:
                      shutil.copyfileobj(source, output)

          actual_files = {
              path.relative_to(artifact_root).as_posix()
              for path in artifact_root.rglob('*')
              if path.is_file()
          }
          if not required_files.issubset(actual_files):
              missing = sorted(required_files - actual_files)
              raise ValueError(f'The deployment artifact is missing files: {missing!r}')

          manifest_entries = {}
          manifest_pattern = re.compile(r'^([0-9a-f]{64})  \./(.+)$')
          for line in (artifact_root / 'manifest.sha256').read_text(encoding='utf-8').splitlines():
              match = manifest_pattern.fullmatch(line)
              if not match:
                  raise ValueError('The deployment artifact manifest is invalid.')
              digest, name = match.groups()
              normalized_name = normalize_name(name)
              if normalized_name in manifest_entries:
                  raise ValueError(f'Duplicate manifest path: {normalized_name!r}')
              manifest_entries[normalized_name] = digest

          payload_files = actual_files - {'manifest.sha256'}
          if set(manifest_entries) != payload_files:
              raise ValueError('The deployment artifact manifest does not list the exact payload.')

          for name, expected_digest in manifest_entries.items():
              digest = hashlib.sha256((artifact_root / name).read_bytes()).hexdigest()
              if digest != expected_digest:
                  raise ValueError(f'The deployment artifact checksum failed for {name!r}.')

          if (artifact_root / 'commit.txt').read_text(encoding='utf-8') != f'{expected_sha}\n':
              raise ValueError('The deployment artifact commit does not match the approved commit.')
          PYTHON

          docker build --tag myoc-docker-sharp-dev-check "$artifact_root/container"

      - name: Prepare resource names
        id: names
        env:
          PR_NUMBER: ${{ needs.validate.outputs.pull_request }}
        working-directory: ${{ runner.temp }}/myoc-dev-control
        run: |
          echo "worker=myoc-pr-${PR_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "container=myoc-docker-sharp-pr-${PR_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "database=myoc-pr-${PR_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "cache=myoc-pr-${PR_NUMBER}-cache" >> "$GITHUB_OUTPUT"
          echo "media_bucket=myoc-pr-${PR_NUMBER}-media" >> "$GITHUB_OUTPUT"
          echo "source_bucket=myoc-pr-${PR_NUMBER}-image-sources" >> "$GITHUB_OUTPUT"
          echo "recent_bucket=myoc-pr-${PR_NUMBER}-recent-feed" >> "$GITHUB_OUTPUT"
          echo "backup_bucket=myoc-pr-${PR_NUMBER}-backups" >> "$GITHUB_OUTPUT"
          echo "preview_workflow=myoc-regenerate-media-previews-pr-${PR_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "preview_queue_0=myoc-pr-${PR_NUMBER}-preview-0" >> "$GITHUB_OUTPUT"
          echo "preview_queue_1=myoc-pr-${PR_NUMBER}-preview-1" >> "$GITHUB_OUTPUT"
          echo "preview_queue_2=myoc-pr-${PR_NUMBER}-preview-2" >> "$GITHUB_OUTPUT"
          echo "preview_dlq=myoc-pr-${PR_NUMBER}-preview-dlq" >> "$GITHUB_OUTPUT"
          echo "image_queue_0=myoc-pr-${PR_NUMBER}-image-processing-0" >> "$GITHUB_OUTPUT"
          echo "image_queue_1=myoc-pr-${PR_NUMBER}-image-processing-1" >> "$GITHUB_OUTPUT"
          echo "image_queue_2=myoc-pr-${PR_NUMBER}-image-processing-2" >> "$GITHUB_OUTPUT"
          echo "image_dlq=myoc-pr-${PR_NUMBER}-image-processing-dlq" >> "$GITHUB_OUTPUT"

      - name: Provision isolated dev storage
        id: resources
        env:
          BACKUP_BUCKET: ${{ steps.names.outputs.backup_bucket }}
          CACHE_NAME: ${{ steps.names.outputs.cache }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          DB_NAME: ${{ steps.names.outputs.database }}
          MEDIA_BUCKET: ${{ steps.names.outputs.media_bucket }}
          SOURCE_BUCKET: ${{ steps.names.outputs.source_bucket }}
          RECENT_BUCKET: ${{ steps.names.outputs.recent_bucket }}
          PREVIEW_QUEUE_0: ${{ steps.names.outputs.preview_queue_0 }}
          PREVIEW_QUEUE_1: ${{ steps.names.outputs.preview_queue_1 }}
          PREVIEW_QUEUE_2: ${{ steps.names.outputs.preview_queue_2 }}
          PREVIEW_DLQ: ${{ steps.names.outputs.preview_dlq }}
          IMAGE_QUEUE_0: ${{ steps.names.outputs.image_queue_0 }}
          IMAGE_QUEUE_1: ${{ steps.names.outputs.image_queue_1 }}
          IMAGE_QUEUE_2: ${{ steps.names.outputs.image_queue_2 }}
          IMAGE_DLQ: ${{ steps.names.outputs.image_dlq }}
          WRANGLER: ${{ steps.wrangler.outputs.path }}
        working-directory: ${{ runner.temp }}/myoc-dev-control
        run: |
          set -euo pipefail

          list_d1_databases() {
            "$WRANGLER" d1 list --json > d1-list.json
          }

          get_db_id() {
            node -e "
              const fs = require('node:fs');
              const databases = JSON.parse(fs.readFileSync('d1-list.json', 'utf8'));
              const database = databases.find((entry) => entry.name === process.env.DB_NAME);
              process.stdout.write(database?.uuid || database?.id || '');
            "
          }

          list_d1_databases
          db_id="$(get_db_id)"

          if [ -z "$db_id" ]; then
            "$WRANGLER" d1 create "$DB_NAME" --location enam
            list_d1_databases
            db_id="$(get_db_id)"
          fi

          if [ -z "$db_id" ]; then
            echo "::error::Dev D1 database was not found after provisioning."
            exit 1
          fi

          "$WRANGLER" kv namespace list > kv-list.json
          cache_id="$(node -e "
            const fs = require('node:fs');
            const namespaces = JSON.parse(fs.readFileSync('kv-list.json', 'utf8'));
            const namespace = namespaces.find((entry) => entry.title === process.env.CACHE_NAME);
            process.stdout.write(namespace?.id || '');
          ")"

          if [ -z "$cache_id" ]; then
            "$WRANGLER" kv namespace create "$CACHE_NAME"
            "$WRANGLER" kv namespace list > kv-list.json
            cache_id="$(node -e "
              const fs = require('node:fs');
              const namespaces = JSON.parse(fs.readFileSync('kv-list.json', 'utf8'));
              const namespace = namespaces.find((entry) => entry.title === process.env.CACHE_NAME);
              process.stdout.write(namespace?.id || '');
            ")"
          fi

          if [ -z "$cache_id" ]; then
            echo "::error::Dev KV namespace was not found after provisioning."
            exit 1
          fi

          for bucket in "$MEDIA_BUCKET" "$SOURCE_BUCKET" "$RECENT_BUCKET" "$BACKUP_BUCKET"; do
            if ! "$WRANGLER" r2 bucket info "$bucket" > /dev/null 2>&1; then
              "$WRANGLER" r2 bucket create "$bucket" --location enam
            fi

            "$WRANGLER" r2 bucket lifecycle remove "$bucket" --name preview-expiry || true
            "$WRANGLER" r2 bucket lifecycle add "$bucket" preview-expiry --expire-days 30 --abort-multipart-days 1 --force
          done

          "$WRANGLER" r2 bucket dev-url enable "$MEDIA_BUCKET" --force
          "$WRANGLER" r2 bucket dev-url get "$MEDIA_BUCKET" > r2-dev-url.txt
          media_base_url="$(node -e "
            const fs = require('node:fs');
            const output = fs.readFileSync('r2-dev-url.txt', 'utf8');
            const url = output.match(/https:\/\/[a-z0-9.-]+\.r2\.dev/i)?.[0];
            const domain = output.match(/[a-z0-9.-]+\.r2\.dev/i)?.[0];
            process.stdout.write(url || (domain ? 'https://' + domain : ''));
          ")"

          if [ -z "$media_base_url" ]; then
            echo "::error::The isolated media bucket did not return an r2.dev URL."
            exit 1
          fi

          "$WRANGLER" r2 bucket dev-url enable "$RECENT_BUCKET" --force
          "$WRANGLER" r2 bucket dev-url get "$RECENT_BUCKET" > recent-r2-dev-url.txt
          recent_base_url="$(node -e "
            const fs = require('node:fs');
            const output = fs.readFileSync('recent-r2-dev-url.txt', 'utf8');
            const url = output.match(/https:\/\/[a-z0-9.-]+\.r2\.dev/i)?.[0];
            const domain = output.match(/[a-z0-9.-]+\.r2\.dev/i)?.[0];
            process.stdout.write(url || (domain ? 'https://' + domain : ''));
          ")"

          if [ -z "$recent_base_url" ]; then
            echo "::error::The isolated recent-feed bucket did not return an r2.dev URL."
            exit 1
          fi

          for queue in "$PREVIEW_QUEUE_0" "$PREVIEW_QUEUE_1" "$PREVIEW_QUEUE_2" "$PREVIEW_DLQ" \
            "$IMAGE_QUEUE_0" "$IMAGE_QUEUE_1" "$IMAGE_QUEUE_2" "$IMAGE_DLQ"; do
            "$WRANGLER" queues info "$queue" > /dev/null 2>&1 || "$WRANGLER" queues create "$queue"
          done

          echo "db_id=$db_id" >> "$GITHUB_OUTPUT"
          echo "cache_id=$cache_id" >> "$GITHUB_OUTPUT"
          echo "media_base_url=$media_base_url" >> "$GITHUB_OUTPUT"
          echo "recent_base_url=$recent_base_url" >> "$GITHUB_OUTPUT"

      - name: Write trusted Wrangler config
        env:
          ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BACKUP_BUCKET: ${{ steps.names.outputs.backup_bucket }}
          CACHE_ID: ${{ steps.resources.outputs.cache_id }}
          CONTAINER_NAME: ${{ steps.names.outputs.container }}
          DB_ID: ${{ steps.resources.outputs.db_id }}
          DB_NAME: ${{ steps.names.outputs.database }}
          MEDIA_BASE_URL: ${{ steps.resources.outputs.media_base_url }}
          MEDIA_BUCKET: ${{ steps.names.outputs.media_bucket }}
          SOURCE_BUCKET: ${{ steps.names.outputs.source_bucket }}
          RECENT_BUCKET: ${{ steps.names.outputs.recent_bucket }}
          RECENT_BASE_URL: ${{ steps.resources.outputs.recent_base_url }}
          PREVIEW_WORKFLOW: ${{ steps.names.outputs.preview_workflow }}
          PREVIEW_QUEUE_0: ${{ steps.names.outputs.preview_queue_0 }}
          PREVIEW_QUEUE_1: ${{ steps.names.outputs.preview_queue_1 }}
          PREVIEW_QUEUE_2: ${{ steps.names.outputs.preview_queue_2 }}
          PREVIEW_DLQ: ${{ steps.names.outputs.preview_dlq }}
          IMAGE_QUEUE_0: ${{ steps.names.outputs.image_queue_0 }}
          IMAGE_QUEUE_1: ${{ steps.names.outputs.image_queue_1 }}
          IMAGE_QUEUE_2: ${{ steps.names.outputs.image_queue_2 }}
          IMAGE_DLQ: ${{ steps.names.outputs.image_dlq }}
          PR_NUMBER: ${{ needs.validate.outputs.pull_request }}
          WORKER_NAME: ${{ steps.names.outputs.worker }}
        working-directory: ${{ runner.temp }}/myoc-dev-control
        run: |
          node <<'NODE'
          const fs = require('node:fs')

          const config = {
            name: process.env.WORKER_NAME,
            main: './artifact/worker/index.js',
            compatibility_date: '2026-06-10',
            workers_dev: true,
            observability: {
              logs: {
                enabled: true,
                invocation_logs: true,
              },
            },
            containers: [
              {
                name: process.env.CONTAINER_NAME,
                class_name: 'MyocDockerSharpContainer',
                image: './artifact/container/Dockerfile',
                image_build_context: './artifact/container',
                instance_type: 'standard-4',
                max_instances: 8,
              },
            ],
            durable_objects: {
              bindings: [
                {
                  name: 'MYOC_DOCKER_SHARP_CONTAINER',
                  class_name: 'MyocDockerSharpContainer',
                },
              ],
            },
            workflows: [
              {
                name: process.env.PREVIEW_WORKFLOW,
                binding: 'REGENERATE_MEDIA_PREVIEWS_WORKFLOW',
                class_name: 'RegenerateMediaPreviewsWorkflow',
                limits: { steps: 25000 },
              },
            ],
            queues: {
              producers: [
                { binding: 'MEDIA_PREVIEW_REGENERATION_QUEUE_0', queue: process.env.PREVIEW_QUEUE_0 },
                { binding: 'MEDIA_PREVIEW_REGENERATION_QUEUE_1', queue: process.env.PREVIEW_QUEUE_1 },
                { binding: 'MEDIA_PREVIEW_REGENERATION_QUEUE_2', queue: process.env.PREVIEW_QUEUE_2 },
                { binding: 'MEDIA_PREVIEW_REGENERATION_DLQ', queue: process.env.PREVIEW_DLQ },
                { binding: 'IMAGE_PROCESSING_QUEUE_0', queue: process.env.IMAGE_QUEUE_0 },
                { binding: 'IMAGE_PROCESSING_QUEUE_1', queue: process.env.IMAGE_QUEUE_1 },
                { binding: 'IMAGE_PROCESSING_QUEUE_2', queue: process.env.IMAGE_QUEUE_2 },
                { binding: 'IMAGE_PROCESSING_DLQ', queue: process.env.IMAGE_DLQ },
              ],
              consumers: [
                ...[process.env.PREVIEW_QUEUE_0, process.env.PREVIEW_QUEUE_1, process.env.PREVIEW_QUEUE_2].map((queue) => ({
                  queue,
                  max_batch_size: 1,
                  max_batch_timeout: 0,
                  max_retries: 2,
                  dead_letter_queue: process.env.PREVIEW_DLQ,
                  max_concurrency: 3,
                  retry_delay: 1,
                })),
                ...[process.env.IMAGE_QUEUE_0, process.env.IMAGE_QUEUE_1, process.env.IMAGE_QUEUE_2].map((queue) => ({
                  queue,
                  max_batch_size: 1,
                  max_batch_timeout: 0,
                  max_retries: 10,
                  dead_letter_queue: process.env.IMAGE_DLQ,
                  max_concurrency: 8,
                  retry_delay: 1,
                })),
                {
                  queue: process.env.PREVIEW_DLQ,
                  max_batch_size: 10,
                  max_batch_timeout: 5,
                  max_retries: 10,
                  max_concurrency: 1,
                  retry_delay: 1,
                },
                {
                  queue: process.env.IMAGE_DLQ,
                  max_batch_size: 10,
                  max_batch_timeout: 5,
                  max_retries: 10,
                  max_concurrency: 1,
                  retry_delay: 1,
                },
              ],
            },
            migrations: [
              {
                tag: 'v1',
                new_sqlite_classes: ['MyocDockerSharpContainer'],
              },
            ],
            assets: {
              directory: './artifact/public',
            },
            vars: {
              CLOUDFLARE_ACCOUNT_ID: process.env.ACCOUNT_ID,
              D1_DATABASE_ID: process.env.DB_ID,
              IMAGE_PROCESSING_DLQ_NAME: process.env.IMAGE_DLQ,
              IMAGE_UPLOAD_ASYNC_ENABLED: 'true',
              MEDIA_PREVIEW_REGENERATION_DLQ_NAME: process.env.PREVIEW_DLQ,
              MEDIA_PREVIEW_OVERFLOW_ENABLED: 'true',
              MEDIA_PUBLIC_BASE_URL: process.env.MEDIA_BASE_URL,
              RECENT_FEED_CLEANUP_ENABLED: 'true',
              RECENT_FEED_BLOCK_ITEMS: '96',
              RECENT_FEED_PUBLISH_ENABLED: 'true',
              RECENT_FEED_PUBLIC_BASE_URL: process.env.RECENT_BASE_URL,
              RECENT_FEED_RETENTION_DAYS: '30',
            },
            secrets: {
              required: ['PREVIEW_PROCESSOR_TOKEN', 'RECENT_FEED_CURSOR_SECRET'],
            },
            d1_databases: [
              {
                binding: 'DB',
                database_name: process.env.DB_NAME,
                database_id: process.env.DB_ID,
                migrations_dir: './artifact/migrations',
              },
            ],
            kv_namespaces: [
              {
                binding: 'CACHE',
                id: process.env.CACHE_ID,
              },
            ],
            ratelimits: [
              {
                name: 'AUTH_NETWORK_RATE_LIMITER',
                namespace_id: `6${process.env.PR_NUMBER}01`,
                simple: { limit: 60, period: 60 },
              },
              {
                name: 'AUTH_IDENTITY_BURST_RATE_LIMITER',
                namespace_id: `6${process.env.PR_NUMBER}02`,
                simple: { limit: 5, period: 10 },
              },
              {
                name: 'AUTH_IDENTITY_SUSTAINED_RATE_LIMITER',
                namespace_id: `6${process.env.PR_NUMBER}03`,
                simple: { limit: 15, period: 60 },
              },
              {
                name: 'AUTH_CHALLENGE_RATE_LIMITER',
                namespace_id: `6${process.env.PR_NUMBER}04`,
                simple: { limit: 10, period: 60 },
              },
            ],
            r2_buckets: [
              {
                binding: 'IMAGE_SOURCE_BUCKET',
                bucket_name: process.env.SOURCE_BUCKET,
              },
              {
                binding: 'MEDIA_BUCKET',
                bucket_name: process.env.MEDIA_BUCKET,
              },
              {
                binding: 'DB_BACKUP_BUCKET',
                bucket_name: process.env.BACKUP_BUCKET,
              },
              {
                binding: 'RECENT_FEED_BUCKET',
                bucket_name: process.env.RECENT_BUCKET,
              },
            ],
            triggers: {
              crons: ['* * * * *'],
            },
          }

          fs.writeFileSync('wrangler.preview.jsonc', `${JSON.stringify(config, null, 2)}\n`)
          NODE

      - name: Migrate isolated dev D1
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          DB_NAME: ${{ steps.names.outputs.database }}
          WRANGLER: ${{ steps.wrangler.outputs.path }}
        working-directory: ${{ runner.temp }}/myoc-dev-control
        run: '"$WRANGLER" d1 migrations apply "$DB_NAME" --config wrangler.preview.jsonc --remote'

      - name: Seed isolated dev D1
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          DB_NAME: ${{ steps.names.outputs.database }}
          WRANGLER: ${{ steps.wrangler.outputs.path }}
        working-directory: ${{ runner.temp }}/myoc-dev-control
        run: '"$WRANGLER" d1 execute "$DB_NAME" --config wrangler.preview.jsonc --remote --file artifact/seeds/development.sql'

      - name: Revalidate pull request before deploy
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        env:
          HEAD_SHA: ${{ needs.validate.outputs.head_sha }}
          PR_NUMBER: ${{ needs.validate.outputs.pull_request }}
        with:
          script: |
            const pullNumber = Number.parseInt(process.env.PR_NUMBER, 10)
            const { data: pullRequest } = await github.rest.pulls.get({
              ...context.repo,
              pull_number: pullNumber,
            })

            if (
              pullRequest.state !== 'open' ||
              pullRequest.base.ref !== 'master' ||
              pullRequest.head.sha !== process.env.HEAD_SHA ||
              pullRequest.head.repo?.full_name !== `${context.repo.owner}/${context.repo.repo}`
            ) {
              core.setFailed('The approved pull request commit is no longer current.')
            }

      - name: Deploy approved preview
        id: deploy-preview
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          HEAD_SHA: ${{ needs.validate.outputs.head_sha }}
          PR_NUMBER: ${{ needs.validate.outputs.pull_request }}
          WRANGLER: ${{ steps.wrangler.outputs.path }}
        working-directory: ${{ runner.temp }}/myoc-dev-control
        run: |
          set -euo pipefail
          trap 'rm -f processor-token.txt cursor-secret.txt preview-secrets.json' EXIT

          openssl rand -hex 32 > processor-token.txt
          openssl rand -hex 32 > cursor-secret.txt
          processor_token="$(tr -d '\n' < processor-token.txt)"
          cursor_secret="$(tr -d '\n' < cursor-secret.txt)"
          echo "::add-mask::$processor_token"
          echo "::add-mask::$cursor_secret"

          node -e "
            const fs = require('node:fs');
            const token = fs.readFileSync('processor-token.txt', 'utf8').trim();
            const cursorSecret = fs.readFileSync('cursor-secret.txt', 'utf8').trim();
            fs.writeFileSync('preview-secrets.json', JSON.stringify({
              PREVIEW_PROCESSOR_TOKEN: token,
              RECENT_FEED_CURSOR_SECRET: cursorSecret,
            }));
          "

          "$WRANGLER" deploy --config wrangler.preview.jsonc --secrets-file preview-secrets.json --no-bundle --message "Approved dev preview $HEAD_SHA" 2>&1 | tee wrangler-preview.log

          preview_url="$(node -e "
            const fs = require('node:fs');
            const log = fs.readFileSync('wrangler-preview.log', 'utf8');
            const urls = [...log.matchAll(/https:\/\/[a-z0-9-]+\.[a-z0-9-]+\.workers\.dev\b/gi)].map((match) => match[0]);
            process.stdout.write(urls.at(-1) || '');
          ")"

          if [ -z "$preview_url" ]; then
            echo "::error::Wrangler did not return a workers.dev URL."
            exit 1
          fi

          echo "preview_url=$preview_url" >> "$GITHUB_OUTPUT"
          {
            echo "### Dev preview"
            echo
            echo "- Pull request: #${PR_NUMBER}"
            echo "- Commit: $HEAD_SHA"
            echo "- URL: $preview_url"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Mark PR deployment successful
        id: deployment-status
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        env:
          DEPLOYMENT_ID: ${{ needs.validate.outputs.deployment_id }}
          PREVIEW_URL: ${{ steps.deploy-preview.outputs.preview_url }}
        with:
          script: |
            const logUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            await github.rest.repos.createDeploymentStatus({
              ...context.repo,
              deployment_id: Number.parseInt(process.env.DEPLOYMENT_ID, 10),
              state: 'success',
              log_url: logUrl,
              environment_url: process.env.PREVIEW_URL,
              description: 'The approved dev preview is ready.',
              environment: 'development',
              auto_inactive: false,
            })

  finalize-deployment:
    name: Finalize failed PR deployment
    if: ${{ always() && needs.validate.outputs.deployment_id != '' && needs.deploy.result != 'success' }}
    needs:
      - validate
      - deploy
    permissions:
      contents: read
      deployments: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Mark PR deployment failed
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        env:
          DEPLOYMENT_ID: ${{ needs.validate.outputs.deployment_id }}
        with:
          script: |
            const deploymentId = Number.parseInt(process.env.DEPLOYMENT_ID, 10)
            const { data: statuses } = await github.rest.repos.listDeploymentStatuses({
              ...context.repo,
              deployment_id: deploymentId,
              per_page: 1,
            })

            if (statuses[0]?.state === 'success' || statuses[0]?.state === 'inactive') {
              return
            }

            const logUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            await github.rest.repos.createDeploymentStatus({
              ...context.repo,
              deployment_id: deploymentId,
              state: 'failure',
              log_url: logUrl,
              description: 'The approved dev preview failed to deploy.',
              environment: 'development',
              auto_inactive: false,
            })
